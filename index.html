  <!-- Fontes do perfil do Pablo (Inter e Roboto Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- FontAwesome para os ícones -->

  <!-- Tailwind CSS para o layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Roboto Mono', 'monospace'],

          colors: {
            brand: '#940c13', // Cor vermelho do botão ativo no menu
          }
        }
      }
    }
  </script>
  <style>
    /* Sombra de texto suave para garantir leitura sobre o background */
    .text-glow {
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 10px rgba(255, 255, 255, 0.5);
    }
    .typing-cursor::after {
      content: '|';
      animation: blink 1s step-end infinite;
      font-weight: 300;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
